# == @local/dsh-codex-ollama-orchestrator
- id: llm-local-t3
  name: '@deepseek-ai/dsh-llm-pi-ai'
  disabled: !!js '!(process.env.DSH_T3_BASE_URL?.trim() && process.env.DSH_T3_MODEL?.trim())'
  config:
    providers:
      local-t3:
        displayName: Local T3 Worker
        api: openai-completions
        baseURL: !!js process.env.DSH_T3_BASE_URL.trim()
        apiKeyEnv: !!js process.env.DSH_T3_API_KEY_REF || undefined
        models:
          - id: !!js process.env.DSH_T3_MODEL.trim()
            input:
              - text
            contextWindow: !!js Number(process.env.DSH_T3_CONTEXT_WINDOW || 32768)
            maxTokens: !!js Number(process.env.DSH_T3_MAX_TOKENS || 4096)
        retryPolicy:
          mode: normal
          maxRetries: 0
        timeoutMs: 60000
        streamIdleTimeoutMs: 60000
- id: preset-deepseek-t2
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: deepseek-t2
    name: DeepSeek T2 Coordinator
    description: >-
      Decomposes T1 outcomes, uses local T3 workers when configured, otherwise
      implements directly, then integrates and validates results.
    order: 20
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: >
            You are T2, the DeepSeek execution coordinator reporting to T1
            Codex. Turn the assigned outcome into a small dependency-ordered
            plan, break it into bounded implementation tasks, and achieve the
            outcome within the assigned scope. T1 owns architecture and final
            acceptance; escalate material scope or architecture changes instead
            of inventing requirements.


            Keep reconnaissance bounded: locate the relevant files and
            boundaries, then dispatch rather than reading the entire project
            yourself. Aim to offload most implementation and test-writing work
            to T3; do not invent extra tasks or pad tokens to hit a usage
            percentage. Prefer targeted grep and short read ranges over
            full-file dumps. If there is no Git repository, do not repeatedly
            try Git commands or search unrelated projects.


            If `subagent` is available, it starts a local T3 worker. Delegate
            suitable independent tasks with precise files, required behavior,
            constraints, expected result and checks. Only use this tool for
            child execution; do not bypass the tier hierarchy with Team
            creation, forks, native Codex or workflow agents. Run parallel
            workers only on disjoint write scopes. Track every child, wait for
            its completion, inspect the actual diff and integrate its output
            before returning to T1. Completion notices arrive automatically:
            never poll worker files/processes or run sleep loops through bash.
            When only waiting remains, end your response and allow the
            completion notice to resume you.


            If no T3 tool is available, implement the tasks yourself with your
            own tools. If T3 fails to start, is unreachable, lacks tool support,
            or returns unusable results, stop dispatching to that unavailable
            route and finish the remaining work yourself. Before touching files
            a failed worker may have changed, inspect its effects; never
            duplicate work while a child may still be running. Do not silently
            switch to Codex or another cloud worker as fallback.


            Review T3 results, run task-level tests and functional checks,
            repair defects and report concrete evidence to T1: changes, checks
            actually run and their outcomes, remaining risks, and whether work
            ran locally or at T2. Do not claim final user acceptance. Respect
            the parent's plan-mode/non-mutation restrictions and permissions
            even when your own preset has execution tools. Do not weaken tests
            or omit functionality to satisfy a completion claim.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-subagent
        name: '@deepseek-ai/dsh-tool-subagent'
        config:
          provider: spawn
          toolName: subagent
          agentPreset: local-t3-worker
          agentOptions:
            provider: unsloth
            model: unsloth/Qwen3.8-27B-GGUF
            maxTokens: 4096
          maxDepth: 2
- id: preset-local-t3-worker
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: local-t3-worker
    name: Local T3 Worker
    description: >-
      Local vLLM/Unsloth-backed implementation leaf; executes a bounded T2
      assignment without further delegation.
    order: 21
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: >
            You are T3, a local implementation worker reporting to T2 DeepSeek.
            Complete only the bounded task and write scope assigned by T2.
            Inspect relevant code using targeted searches and bounded read
            ranges, make the smallest correct change, and run the requested
            checks. Do not inventory unrelated workspace projects, repeatedly
            test for Git after finding no repository, or dump whole large files
            when a relevant function range suffices. Respect inherited
            non-mutation/plan-mode instructions and permissions. Do not delegate
            through any tool, start additional agents, change model routes or
            broaden scope. If blocked, report the concrete blocker rather than
            guessing or claiming success. Return changed files, checks actually
            run and results, and unresolved issues to T2; T1 Codex owns final
            functionality review and acceptance.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
# == dsh-hierarchical-orchestrator
- id: dsh-hierarchical-orchestrator
  name: dsh-hierarchical-orchestrator
  config:
    enabled: true
    storeBackend: native
    allowCloud: false
    sources: []
    tiers:
      T1: []
      T2: []
      T3: []
    groups: {}
    allowedTools: []
    projectBudget: 0
